name: Lint & Type Check
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: ESLint
      run: npm run lint
    - name: Stylelint
      run: npm run lint:css
    - name: Type check
      run: npm run type-check
