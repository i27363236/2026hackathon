<!-- Finn the Human — example custom stamp icon.
     Authored with fill="none" stroke="currentColor" so the stamp builder can tint it
     to the chosen stamp colour (same pipeline as Phosphor icons). viewBox matches
     Phosphor (0 0 256 256). Copy this file to add your own custom icons. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
  <!-- ears -->
  <path d="M104 68 C96 44 82 40 72 46 C62 52 62 66 72 78" />
  <path d="M152 68 C160 44 174 40 184 46 C194 52 194 66 184 78" />
  <!-- head -->
  <rect x="56" y="62" width="144" height="142" rx="46" />
  <!-- eyes -->
  <circle cx="106" cy="138" r="9" fill="currentColor" stroke="none" />
  <circle cx="150" cy="138" r="9" fill="currentColor" stroke="none" />
  <!-- smile -->
  <path d="M110 166 C120 180 136 180 146 166" />
</svg>
